<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Callback Mercado Livre</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; margin: 0; padding: 24px; }
  .box { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin-top: 0; }
  code { display: block; background: #fff8d6; border: 1px solid #ffe600; border-radius: 8px; padding: 12px; font-size: 16px; word-break: break-all; }
  button { margin-top: 12px; padding: 10px 16px; font-size: 15px; border: 0; border-radius: 8px; background: #3483fa; color: #fff; cursor: pointer; }
  .erro { color: #c00; }
  small { color: #666; }
</style>
</head>
<body>
<div class="box">
  <h1>Autorização do Mercado Livre</h1>
  <div id="conteudo">Lendo o código...</div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code');
  const erro = p.get('error');
  const el = document.getElementById('conteudo');
  if (code) {
    el.innerHTML = '<p>Código recebido. Use agora para gerar o token (ele expira rápido):</p>' +
      '<code id="c"></code><button id="b">Copiar código</button>' +
      '<p><small>Não compartilhe este código com ninguém.</small></p>';
    document.getElementById('c').textContent = code;
    document.getElementById('b').onclick = () => {
      navigator.clipboard.writeText(code).then(() => { document.getElementById('b').textContent = 'Copiado!'; });
    };
    history.replaceState(null, '', location.pathname);
  } else if (erro) {
    el.innerHTML = '<p class="erro">A autorização falhou: <span id="e"></span></p>';
    document.getElementById('e').textContent = erro + ' ' + (p.get('error_description') || '');
  } else {
    el.textContent = 'Nenhum código na URL. Esta página só mostra o código depois que você autoriza o app no Mercado Livre.';
  }
</script>
</body>
</html>
